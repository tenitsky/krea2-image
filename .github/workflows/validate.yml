name: Validate template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow
      - name: Check shell and Python syntax
        run: |
          bash -n setup.sh
          bash -n bootstrap.sh
          python -m compileall -q custom_nodes tools scripts
      - name: The start command is bootstrap.sh
        run: python -c "import json; assert json.load(open('runpod-start.json'))['cmd'][0] == open('bootstrap.sh').read()"
      - name: Workflows match the builder and the node schemas
        run: |
          python tools/build_workflow.py
          git diff --exit-code workflows
          python -B tools/test_workflows.py
      - name: Prompt List and Contact Sheet nodes
        run: python -B tools/test_nodes.py
      - name: Network Volume and Global Volume storage
        run: python -B tools/test_storage.py
